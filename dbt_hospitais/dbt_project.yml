name: hospitais_sus
version: "1.0.0"
config-version: 2
profile: hospitais_sus

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  dim_data_inicio: "2000-01-01"

# Arquitetura medalhão: cada pasta de models/ vira um schema no Postgres.
# A materialização também é declarada no config() de cada .sql (o config do arquivo tem precedência).
models:
  hospitais_sus:
    bronze:
      +schema: bronze
      +materialized: view
      +tags: ["bronze"]
    silver:
      +schema: silver
      +materialized: view
      +tags: ["silver"]
    gold:
      +schema: gold
      +materialized: table
      +tags: ["gold"]

seeds:
  hospitais_sus:
    +schema: silver
    +tags: ["silver"]
